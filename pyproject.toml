[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sslcompare"
version = "0.1.0"
description = "Self-supervised learning comparison framework"
authors = [{ name = "Hayaru Shouno" }]
readme = "README.md"
requires-python = ">=3.9"

dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pillow",
    "six",
    "ipython",
    "ipykernel",
    "joblib",
    "pandas",
    "lightning",
    "wandb",
]

[tool.setuptools]
package-dir = { "" = "sslcompare" }

[tool.setuptools.packages.find]
where = ["sslcompare"]
